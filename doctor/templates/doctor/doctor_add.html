{% extends 'patient/base.html' %}

{% block title %}Add Doctor{% endblock %}
{% block page_title %}Add Doctor{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Doctor</h2>
    <form method="post" action="{% url 'doctor:doctor_add' %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label for="specialization">Specialization</label>
                <input type="text" id="specialization" name="specialization" required>
            </div>
            <div>
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select department</option>
                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Orthopedics</option>
                    <option>Pediatrics</option>
                    <option>General Medicine</option>
                    <option>Dermatology</option>
                </select>
            </div>
            <div>
                <label for="experience_years">Experience (years)</label>
                <input type="number" id="experience_years" name="experience_years" min="0" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="present_address">Present Address</label>
                <input type="text" id="present_address" name="present_address">
            </div>
            <div>
                <label for="permanent_address">Permanent Address</label>
                <input type="text" id="permanent_address" name="permanent_address">
            </div>
            <div>
                <label for="education">Education</label>
                <input type="text" id="education" name="education">
            </div>
        </div>
        <div>
            <label><input type="checkbox" name="available" checked> Available</label>
        </div>
        <button type="submit">Save Doctor</button>
        <a href="{% url 'doctor:doctor_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #ccc; color: #333; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

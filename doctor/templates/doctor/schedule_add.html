{% extends 'patient/base.html' %}

{% block title %}Add Schedule{% endblock %}
{% block page_title %}Add Schedule{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Schedule</h2>
    <form method="post" action="{% url 'doctor:schedule_add' %}">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label for="doctor" class="field-label">Doctor</label>
                <select id="doctor" name="doctor" required>
                    <option value="">Select doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">{{ doctor.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="day_of_week" class="field-label">Day of Week</label>
                <select id="day_of_week" name="day_of_week" required>
                    <option value="">Select day</option>
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="wednesday">Wednesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="friday">Friday</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="start_time" class="field-label">Start Time</label>
                <input type="time" id="start_time" name="start_time" required>
            </div>
            <div class="col-md-6">
                <label for="end_time" class="field-label">End Time</label>
                <input type="time" id="end_time" name="end_time" required>
            </div>
            <div class="col-md-6">
                <label class="toggle">
                    <input type="checkbox" name="available" checked>
                    <span class="slider"></span>
                    Available
                </label>
            </div>
        </div>
        <div style="margin-top: 24px;">
            <button type="submit">Save Schedule</button>
            <a href="{% url 'doctor:schedule_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

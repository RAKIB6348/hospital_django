{% extends 'patient/base.html' %}

{% block title %}Add User{% endblock %}
{% block page_title %}Add User{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New User</h2>
    <form method="post" action="{% url 'auth_user:user_add' %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="">Select role</option>
                    <option value="admin">Admin</option>
                    <option value="receptionist">Receptionist</option>
                    <option value="nurse">Nurse</option>
                    <option value="doctor">Doctor</option>
                </select>
            </div>
        </div>
        <div>
            <label><input type="checkbox" name="is_active" checked> Active</label>
        </div>
        <button type="submit">Save User</button>
        <a href="{% url 'auth_user:user_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

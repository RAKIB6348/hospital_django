{% extends 'patient/base.html' %}

{% block title %}Edit User{% endblock %}
{% block page_title %}Edit User{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit User</h2>
    <form method="post" action="{% url 'auth_user:user_edit' user.id %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>
            </div>
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ user.phone }}">
            </div>
            <div>
                <label for="password">Password (leave blank to keep)</label>
                <input type="password" id="password" name="password">
            </div>
            <div>
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    <option value="receptionist" {% if user.role == 'receptionist' %}selected{% endif %}>Receptionist</option>
                    <option value="nurse" {% if user.role == 'nurse' %}selected{% endif %}>Nurse</option>
                    <option value="doctor" {% if user.role == 'doctor' %}selected{% endif %}>Doctor</option>
                </select>
            </div>
        </div>
        <div>
            <label><input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}> Active</label>
        </div>
        <button type="submit">Update User</button>
        <a href="{% url 'auth_user:user_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

{% extends 'patient/base.html' %}

{% block title %}Edit Appointment{% endblock %}
{% block page_title %}Edit Appointment{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Appointment</h2>
    <form method="post" action="{% url 'appointment_edit' appointment.id %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="patient_name">Patient Name</label>
                <input type="text" id="patient_name" name="patient_name" value="{{ appointment.patient_name }}" required>
            </div>
            <div>
                <label for="patient_age">Age</label>
                <input type="number" id="patient_age" name="patient_age" min="0" max="150" value="{{ appointment.patient_age }}" required>
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="male" {% if appointment.gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if appointment.gender == 'female' %}selected{% endif %}>Female</option>
                    <option value="other" {% if appointment.gender == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ appointment.address }}">
            </div>
            <div>
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select department</option>
                    {% for department in departments %}
                    <option value="{{ department.name }}" {% if department.name == appointment.department %}selected{% endif %}>{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="doctor">Doctor</label>
                <select id="doctor" name="doctor" required>
                    <option value="">Select doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.full_name }}" {% if doctor.full_name == appointment.doctor %}selected{% endif %}>{{ doctor.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ appointment.date|date:'Y-m-d' }}" required>
            </div>
            <div>
                <label for="time">Time</label>
                <input type="time" id="time" name="time" value="{{ appointment.time|time:'H:i' }}" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ appointment.phone }}">
            </div>
            <div>
                <label for="reason">Reason for Visit</label>
                <input type="text" id="reason" name="reason" value="{{ appointment.reason }}">
            </div>
        </div>
        <button type="submit">Update Appointment</button>
        <a href="{% url 'appointment_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

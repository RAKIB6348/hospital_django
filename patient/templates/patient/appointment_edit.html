{% extends 'patient/base.html' %}

{% block title %}Edit Appointment{% endblock %}
{% block page_title %}Edit Appointment{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Appointment</h2>
    {% if error %}
    <div class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}
    <form method="post" action="{% url 'appointment_edit' appointment.id %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label class="field-label" for="patient_name">Patient Name</label>
                <input type="text" id="patient_name" name="patient_name" value="{{ form_data.patient_name|default:appointment.patient_name }}" required>
            </div>
            <div>
                <label class="field-label" for="patient_age">Age</label>
                <input type="number" id="patient_age" name="patient_age" min="0" max="150" value="{{ form_data.patient_age|default:appointment.patient_age }}" required>
            </div>
            <div>
                <label class="field-label" for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="male" {% if form_data.gender|default:appointment.gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if form_data.gender|default:appointment.gender == 'female' %}selected{% endif %}>Female</option>
                    <option value="other" {% if form_data.gender|default:appointment.gender == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ form_data.address|default:appointment.address }}">
            </div>
            <div>
                <label class="field-label" for="department">Department</label>
                <select id="department" name="department" required onchange="onDepartmentChange()">
                    <option value="">Select department</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}" {% if selected_department_id == department.id %}selected{% endif %}>{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="field-label" for="doctor">Doctor</label>
                <select id="doctor" name="doctor" required onchange="loadDoctorInfo()">
                    <option value="">Select doctor</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="fee">Consultation Fee</label>
                <input type="text" id="fee" name="consultation_fee" readonly tabindex="-1" style="background-color:#f1f3f5; cursor:not-allowed;" placeholder="৳ 0.00">
            </div>
            <div>
                <label class="field-label" for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ form_data.date|default:appointment.date|date:'Y-m-d' }}" required>
            </div>
            <div>
                <label class="field-label" for="schedule">Schedule</label>
                <select id="schedule" name="schedule" required>
                    <option value="">Select a doctor first</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ form_data.phone|default:appointment.phone }}">
            </div>
            <div>
                <label class="field-label" for="reason">Reason for Visit</label>
                <input type="text" id="reason" name="reason" value="{{ form_data.reason|default:appointment.reason }}">
            </div>
        </div>
        <button type="submit">Update Appointment</button>
        <a href="{% url 'appointment_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
<script>
    var selectedDepartmentId = {{ selected_department_id|default:'null' }};
    var doctorId = {{ selected_doctor_id|default:'null' }};
    var scheduleId = {{ selected_schedule_id|default:'null' }};
    var doctorInfoUrl = "{% url 'doctor_info' 999999 %}".replace('999999', '');

    function resetSchedule() {
        document.getElementById('schedule').innerHTML = '<option value="">Select a doctor first</option>';
    }

    function resetDoctor() {
        document.getElementById('doctor').innerHTML = '<option value="">Select doctor</option>';
        document.getElementById('fee').value = '';
        resetSchedule();
    }

    function onDepartmentChange() {
        doctorId = null;
        scheduleId = null;
        loadDoctors();
    }

    function loadDoctors() {
        var dept = document.getElementById('department').value;
        resetDoctor();
        if (!dept) return;
        fetch("{% url 'doctors_by_department' %}?department_id=" + dept)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var doctorSel = document.getElementById('doctor');
                data.doctors.forEach(function (d) {
                    var opt = document.createElement('option');
                    opt.value = d.id;
                    opt.text = d.name;
                    if (doctorId && String(d.id) === String(doctorId)) opt.selected = true;
                    doctorSel.appendChild(opt);
                });
                if (doctorSel.value) {
                    loadDoctorInfo();
                } else {
                    resetSchedule();
                }
            });
    }

    function loadDoctorInfo() {
        var doc = document.getElementById('doctor').value;
        var feeInput = document.getElementById('fee');
        feeInput.value = '';
        resetSchedule();
        if (!doc) return;
        fetch(doctorInfoUrl + doc + '/')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                feeInput.value = '৳ ' + data.consultation_fee;
                var scheduleSel = document.getElementById('schedule');
                if (data.schedules.length === 0) {
                    scheduleSel.innerHTML = '<option value="">No schedule available</option>';
                    return;
                }
                scheduleSel.innerHTML = '<option value="">Select schedule</option>';
                data.schedules.forEach(function (s) {
                    var opt = document.createElement('option');
                    opt.value = s.id;
                    opt.text = s.label;
                    if (scheduleId && String(s.id) === String(scheduleId)) opt.selected = true;
                    scheduleSel.appendChild(opt);
                });
            });
    }

    if (selectedDepartmentId) {
        document.getElementById('department').value = selectedDepartmentId;
        loadDoctors();
    }
</script>
{% endblock %}

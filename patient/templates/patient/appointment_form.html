{% extends 'patient/base.html' %}

{% block title %}Appointment Registration{% endblock %}
{% block page_title %}Appointment Registration{% endblock %}

{% block content %}
<div class="card">
    <h2>Register New Appointment</h2>
    <form method="post" action="{% url 'appointment_form' %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="patient_name">Patient Name</label>
                <input type="text" id="patient_name" name="patient_name" required>
            </div>
            <div>
                <label for="patient_age">Age</label>
                <input type="number" id="patient_age" name="patient_age" min="0" max="150" required>
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
            </div>
            <div>
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select department</option>
                    {% for department in departments %}
                    <option value="{{ department.name }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="doctor">Doctor</label>
                <select id="doctor" name="doctor" required>
                    <option value="">Select doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.name }}">{{ doctor.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div>
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div>
                <label for="reason">Reason for Visit</label>
                <input type="text" id="reason" name="reason">
            </div>
        </div>
        <button type="submit">Book Appointment</button>
        <a href="{% url 'appointment_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #e63535; color: #fff; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

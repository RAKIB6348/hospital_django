{% extends 'patient/base.html' %}

{% block title %}Edit Department{% endblock %}
{% block page_title %}Edit Department{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Department</h2>
    <form method="post" action="{% url 'department:department_edit' department.id %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="name">Department Name</label>
                <input type="text" id="name" name="name" value="{{ department.name }}" required>
            </div>
            <div>
                <label for="head_doctor">Head Doctor</label>
                <select id="head_doctor" name="head_doctor" required>
                    <option value="">Select doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.full_name }}" {% if doctor.full_name == department.head_doctor %}selected{% endif %}>{{ doctor.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="number_of_doctors">No. of Doctors</label>
                <input type="number" id="number_of_doctors" name="number_of_doctors" min="0" value="{{ department.number_of_doctors }}" required>
            </div>
            <div>
                <label for="available_beds">Available Beds</label>
                <input type="number" id="available_beds" name="available_beds" min="0" value="{{ department.available_beds }}" required>
            </div>
        </div>
        <button type="submit">Update Department</button>
        <a href="{% url 'department:department_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

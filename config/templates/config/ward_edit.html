{% extends 'patient/base.html' %}

{% block title %}Edit Ward{% endblock %}
{% block page_title %}Edit Ward{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Ward</h2>
    <form method="post" action="{% url 'config:ward_edit' ward.id %}">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="name">Ward Name</label>
                <input type="text" id="name" name="name" value="{{ ward.name }}" required>
            </div>
            <div>
                <label for="number_of_beds">Total Beds</label>
                <input type="number" id="number_of_beds" name="number_of_beds" min="0" value="{{ ward.number_of_beds }}" required>
            </div>
            <div>
                <label for="available_beds">Available Beds</label>
                <input type="number" id="available_beds" name="available_beds" min="0" value="{{ ward.available_beds }}" required>
            </div>
        </div>
        <button type="submit">Update Ward</button>
        <a href="{% url 'config:ward_list' %}" style="margin-top: 20px; display: inline-block; padding: 10px 24px; background: #d32f2f; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}
